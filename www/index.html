<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dbe9e3">
<title>مفقسة - عمر الفقاسة والتقليب</title>
<style>
:root{--bg:#dbe9e3;--card:#fbf8f1;--ink:#13302a;--mute:#56706a;--line:#c3d6cd;--yolk:#f2a900;--yolk2:#ffd34d;--ember:#c8431b;--moss:#2f7a55;--shell:#eef5f1;--on-yolk:#13302a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1c19;--card:#163029;--ink:#e9f2ed;--mute:#93ada3;--line:#27463d;--yolk:#f6b723;--yolk2:#ffe27a;--ember:#ff8159;--moss:#6fcf9c;--shell:#0f2420;--on-yolk:#10241f}}
*{box-sizing:border-box;margin:0;font-family:"Noto Kufi Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 112px);font-variant-numeric:tabular-nums;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}

header{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:22px 2px 14px}
h1{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.5px}
.hs{font-size:13px;color:var(--mute);margin-top:4px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink)}

.batch{background:var(--card);border-radius:26px;padding:16px;margin-bottom:16px;border:1.5px solid var(--line)}
.top{display:flex;gap:18px;align-items:center}
.egg{width:112px;height:146px;flex:none;overflow:visible}
.eshell{fill:var(--shell)}
.efill{fill:url(#glow);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.eline{fill:none;stroke:var(--ink);stroke-width:2.5;opacity:.85}
.info{min-width:0;flex:1}
h2{font-size:21px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.muted{font-size:13px;color:var(--mute)}
.day{font-size:15px;margin-top:6px}.day .of{white-space:nowrap}.day b{font-size:30px;font-weight:900;color:var(--ink)}
.stage{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700}
.stage.ok{background:var(--moss);color:#fff}.stage.no{background:var(--ember);color:#fff}

.turn{margin-top:14px;padding:14px;border-radius:20px;background:var(--yolk);color:var(--on-yolk)}
.turn .lb{font-size:13px;font-weight:700;opacity:.85}
.turn .cd{font-size:36px;font-weight:900;text-align:center;line-height:1.2;margin:2px 0}
.turn .nd{font-size:13px;text-align:center;opacity:.85;min-height:20px}
.turn.off{background:var(--bg);color:var(--mute)}
.done{width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--on-yolk);color:var(--yolk2);font-weight:800;font-size:16px}
.turn.off .done{display:none}

dl.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
dl.facts.main dd{font-size:15px}
.more{margin-top:14px;border-top:1.5px solid var(--line);padding-top:10px}
.more summary{cursor:pointer;font-weight:800;font-size:14px;padding:6px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"﹀";margin-inline-start:8px;display:inline-block;transition:transform .2s}
.more[open] summary::after{transform:rotate(180deg)}
.more dl.facts{margin-top:6px}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{font-size:14px;font-weight:700}
.facts .wide{grid-column:1/-1}

.cand{margin-top:14px;padding:12px 14px;border-radius:18px;border:1.5px dashed var(--line)}
.cand .t{font-size:13px;color:var(--mute)}
.split{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:8px 0;background:var(--line)}
.split i{display:block;height:100%}.split .f{background:var(--moss)}.split .c{background:var(--ember)}
.cand .n{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.cand .n .f{color:var(--moss)}.cand .n .c{color:var(--ember)}
.cand button{margin-top:8px;background:transparent;color:var(--ink);font-weight:800;text-decoration:underline;padding:6px 0}

.edit{width:100%;margin-top:14px;padding:12px;border-radius:14px;background:transparent;border:1.5px solid var(--line);font-weight:800}

.tip{margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--bg)}
.tip .tt{font-weight:800;font-size:15px}
.tip p{font-size:13px;color:var(--mute);margin-top:2px}
.tip p.tl{color:var(--ink);font-weight:700;margin-top:8px}
.tip small{display:block;font-size:11px;color:var(--mute);margin-top:8px}
.emb{fill:var(--ember);opacity:.5;transform-box:view-box;transform-origin:50px 90px;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.hb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}
.hb .ghost{padding:7px 11px;font-size:12px}
.panel textarea{display:block;width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:12px/1.5 ui-monospace,Menlo,monospace;direction:ltr;text-align:left;resize:vertical}
#bmsg{min-height:20px;color:var(--moss);font-weight:700}
.empty{text-align:center;padding:56px 20px;color:var(--mute)}
.empty svg{width:84px;margin-bottom:14px}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}

#fab{position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:15px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:900;font-size:17px;box-shadow:0 10px 26px #0004}

.ov{position:fixed;inset:0;z-index:20;background:#0009;align-items:flex-end}
.ov:not([hidden]){display:flex}
.panel{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px)}
.panel h2{font-size:22px;margin-bottom:6px}
.panel label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-top:14px}
.panel input,.panel select{display:block;width:100%;margin-top:6px;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.panel .row{display:flex;gap:10px;margin-top:20px}
.panel .row button{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:16px}
#sv{background:var(--yolk);color:var(--on-yolk)}
#cn{background:var(--bg);color:var(--ink)}
#dl{width:100%;margin-top:14px;padding:12px;background:transparent;color:var(--ember);font-weight:800;border-radius:14px}

#bn{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;z-index:30;background:var(--ember);color:#fff;padding:16px;border-radius:20px;box-shadow:0 10px 30px #0006;text-align:center}
#bn button{margin-top:10px;background:#fff;color:#111;border-radius:12px;padding:10px 18px;font-weight:800}
@media(prefers-reduced-motion:reduce){.efill,.emb{transition:none}}
</style>
</head>
<body>
<div id="bn" role="alert"><b id="bt"></b><div id="bb" style="margin:6px 0"></div><button id="bx">إيقاف التنبيه</button></div>

<header>
  <div><h1>المفقسة</h1><div class="hs" id="hs"></div></div>
  <div class="hb"><button class="ghost" id="tn">اختبار التنبيه</button><button class="ghost" id="rgb">نغمة التنبيه</button><button class="ghost" id="bkb">نسخة احتياطية</button></div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="glow" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e08a00"/><stop offset=".6" stop-color="#f2a900"/><stop offset="1" stop-color="#ffd34d"/></linearGradient></defs></svg>

<main id="list"></main>
<button id="fab">+ دفعة جديدة</button>

<div id="sheet" class="ov" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sh">
    <h2 id="sh">دفعة جديدة</h2>
    <label>اسم الدفعة<input id="nm" placeholder="مثال: دجاج بلدي"></label>
    <label>نوع البيض<select id="sp"></select></label>
    <label id="cu" style="display:none">مدة الحضانة (أيام)<input id="cd" type="number" inputmode="numeric" min="1" value="21"></label>
    <div class="two">
      <label>عدد البيض<input id="ec" type="number" inputmode="numeric" min="1" value="20"></label>
      <label>مرات التقليب يومياً<input id="tpd" type="number" inputmode="decimal" min="1" max="24" value="3"></label>
    </div>
    <div class="hint" id="ivh"></div>
    <label>بداية الحضانة<input id="st" type="datetime-local"></label>
    <label id="tbw">وقت التقليب القادم<input id="tb" type="datetime-local"></label>
    <label id="clw">عدد البيض الفارغ بعد الفحص (اليوم 5)<input id="cl" type="number" inputmode="numeric" min="0" placeholder="اتركه فارغاً إن لم تفحص بعد"></label>
    <div class="row"><button id="sv">حفظ</button><button id="cn">إلغاء</button></div>
    <button id="dl">حذف الدفعة</button>
  </div>
</div>

<div id="rg" class="ov" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="rh">
    <h2 id="rh">نغمة التنبيه</h2>
    <p class="hint">اختر أي نغمة من نغمات هاتفك لتُستخدم في إشعارات التقليب والفحص والفقس.</p>
    <p class="tl" style="margin-top:14px;font-weight:800" id="rcur"></p>
    <div class="hint" id="rmsg" role="status" style="min-height:20px"></div>
    <div class="row"><button id="rpick">اختيار من الهاتف</button><button id="rtest" style="background:var(--bg);color:var(--ink)">تجربة</button></div>
    <button id="rreset" class="ghost" style="width:100%;margin-top:12px;border-radius:14px;padding:12px">العودة للنغمة الافتراضية</button>
    <button id="rclose" class="ghost" style="width:100%;margin-top:8px;border-radius:14px;padding:12px">إغلاق</button>
  </div>
</div>

<div id="bk" class="ov" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="bh">
    <h2 id="bh">نسخة احتياطية</h2>
    <p class="hint">انسخ النص أدناه واحفظه في ملاحظاتك أو أرسله لنفسك. للاسترجاع الصق النص هنا ثم اضغط «استيراد».</p>
    <textarea id="bt2" rows="8" spellcheck="false"></textarea>
    <div class="hint" id="bmsg" role="status"></div>
    <div class="row"><button id="bcopy">نسخ النص</button><button id="bimp" style="background:var(--bg);color:var(--ink)">استيراد</button></div>
    <button id="bclose" class="ghost" style="width:100%;margin-top:12px;border-radius:14px;padding:12px">إغلاق</button>
  </div>
</div>

<script>
const DAY=864e5,HR=36e5,$=s=>document.querySelector(s);
const SP=[["دجاج",21,3],["بط",28,3],["بط مسكوفي",35,3],["إوز",30,3],["رومي",28,3],["سمان",17,3],["حمام",18,2],["نعام",42,3],["مخصص",21,3]];
const EG="M50 4C74 4 92 52 92 82c0 26-19 44-42 44S8 108 8 82C8 52 26 4 50 4Z";
const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const RP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.RingtonePicker;
let RING=null;try{RING=JSON.parse(localStorage.getItem("incRing")||"null")}catch(e){}
const chId=()=>RING&&RING.ch?RING.ch:"hatch2";
let S;try{S=JSON.parse(localStorage.getItem("inc")||"")}catch(e){}
S=S&&S.b?S:{b:[],n:1};
const save=()=>{try{localStorage.setItem("inc",JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,"0");
const fd=t=>{const d=new Date(t);return "⁦"+p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+"  "+p2(d.getHours())+":"+p2(d.getMinutes())+"⁩"};
const dur=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1e3);const d=Math.floor(s/86400);return (d?d+" يوم · ":"")+"⁦"+p2(Math.floor(s%86400/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)+"⁩"};
const loc=t=>{const d=new Date(t-new Date(t).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
const pc=(n,t)=>t?Math.round(n/t*100):0;
const num=s=>+String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const spName=b=>b.sp!=null&&SP[b.sp]?SP[b.sp][0]:"";

let AC;
const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}};
document.addEventListener("click",unlock);
function beep(){try{unlock();[0,.35,.7,1.05,1.4,1.75].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type="sine";o.frequency.value=i%2?988:740;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.5,s);g.gain.exponentialRampToValueAtTime(.001,s+.3);o.start(s);o.stop(s+.32)});if(navigator.vibrate)navigator.vibrate([300,150,300,150,300])}catch(e){}}
const CH=LN?LN.createChannel({id:"hatch2",sound:"ringtone.wav",name:"تنبيهات المفقسة",description:"مواعيد التقليب والفقس",importance:5,visibility:1,vibration:true,lights:true}).catch(()=>{}):0;
SP.forEach((s,i)=>$("#sp").add(new Option(s[0]+(i<8?" ("+s[1]+" يوم)":""),i)));

/* ---------- المواعيد والإشعارات ---------- */
function ev(b){
  const hatch=b.start+b.days*DAY,stop=hatch-b.lock*DAY,iv=b.iv*HR,o=[];
  const bs=b.tb||b.start;
  for(let k=b.tb?0:1;bs+k*iv<stop;k++)o.push({turn:1,at:bs+k*iv,t:"🔄 وقت التقليب",b:b.name+": حان موعد تقليب البيض"});
  if(b.start+5*DAY<stop)o.push({at:b.start+5*DAY,t:"🔦 وقت الفحص بالضوء",b:b.name+": افحص البيض وسجّل عدد الفارغ والمخصب"});
  if(stop>b.start)o.push({at:stop,t:"⛔ إيقاف التقليب",b:b.name+": توقف عن التقليب وارفع الرطوبة"});
  o.push({at:hatch-DAY,t:"⏳ باقي يوم على الفقس",b:b.name+": يبدأ الفقس غداً"});
  o.push({at:hatch,t:"🐣 موعد الفقس",b:b.name+": حان موعد الفقس!"});
  return o.sort((a,c)=>a.at-c.at);
}
async function perm(){try{if(LN)await LN.requestPermissions();else if("Notification"in window&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}}
async function plan(b){
  if(!LN)return;
  try{
    await CH;
    const pend=await LN.getPending();
    const ids=pend.notifications.filter(n=>Math.floor(n.id/1000)==b.id).map(n=>({id:n.id}));
    if(ids.length)await LN.cancel({notifications:ids});
    if(b.gone)return;
    const now=Date.now(),cap=Math.max(60,Math.floor(450/Math.max(1,S.b.length)));
    const all=ev(b).filter(e=>e.at>now),imp=all.filter(e=>!e.turn),tr=all.filter(e=>e.turn);
    const list=imp.concat(tr.slice(0,Math.max(0,cap-imp.length))).sort((a,c)=>a.at-c.at);
    if(list.length)await LN.schedule({notifications:list.map((e,i)=>({id:b.id*1000+i,channelId:chId(),title:e.t,body:e.b,schedule:{at:new Date(e.at),allowWhileIdle:true}}))});
  }catch(e){}
}
let bi;
function banner(t,b){$("#bt").textContent=t;$("#bb").textContent=b;$("#bn").style.display="block";clearInterval(bi);bi=setInterval(beep,5000)}
$("#bx").onclick=()=>{$("#bn").style.display="none";clearInterval(bi)};
async function notify(t,b){
  try{
    if(LN)await LN.schedule({notifications:[{id:999999,channelId:chId(),title:t,body:b,schedule:{at:new Date(Date.now()+1500)}}]});
    else if("Notification"in window&&Notification.permission==="granted")new Notification(t,{body:b});
    else banner(t,b);
  }catch(e){}
}
// يشغّل الصوت داخل التطبيق عند كل موعد (والإشعار في المتصفح)
let lastCheck=Date.now();
setInterval(()=>{
  const now=Date.now();let hit=0;
  S.b.forEach(b=>ev(b).forEach(e=>{if(e.at>lastCheck&&e.at<=now){hit=1;if(!LN)notify(e.t,e.b)}}));
  if(hit)beep();lastCheck=now;
},1000);

/* ---------- مراحل النمو والنصائح ---------- */
const STG=[
 [.14,"القلب يبدأ بالنبض","تتكوّن الأوعية الدموية الأولى وأعضاء الجنين."],
 [.33,"تكوّن العينين والأطراف","يظهر المنقار والأجنحة والأرجل. بالفحص بالضوء تُرى شبكة أوعية دموية وجنين صغير."],
 [.52,"اكتمال الشكل","يتشكل المنقار والأصابع وتبدأ بصيلات الريش بالظهور."],
 [.71,"نمو الريش","يغطي الريش الجسم ويكبر الجنين فيملأ معظم البيضة."],
 [.86,"الاستعداد للفقس","يتجه الجنين نحو الطرف العريض ويمتص ما تبقى من الصفار."],
 [1.01,"مرحلة الفقس","يبدأ الجنين بالتنفس ثم ينقر القشرة. لا تفتح الحاضنة."]
];
// [الحرارة، الرطوبة أثناء التقليب، الرطوبة وقت الفقس] حسب ترتيب الأنواع
const TH=[["37.5–37.8","45–55%","65–75%"],["37.5","55–65%","70–75%"],["37.5","55–60%","65–70%"],["37.5","50–55%","65–75%"],["37.5","50–55%","65–70%"],["37.5","40–50%","65–70%"],["37.5","50–55%","65–70%"],["36–36.5","25–35%","30–40%"],["37.5","50–55%","65–70%"]];
function tipHtml(b,c){
  const th=TH[b.sp!=null&&TH[b.sp]?b.sp:8],f=c.pct/100;const T=`🌡️ <bdi>${th[0]}</bdi>°م`,H=x=>`💧 <bdi>${x}</bdi>`;
  const pre=c.now<b.start,post=c.now>=c.hatch;
  let tt,ds,tl;
  if(pre){tt="لم تبدأ الحضانة بعد";ds="شغّل الحاضنة قبل وضع البيض بساعات حتى تثبت الحرارة والرطوبة.";tl=T+" · "+H(th[1])}
  else if(post){tt="حان الفقس";ds="اترك المواليد تجفّ داخل الحاضنة قبل نقلها.";tl=T+" · "+H(th[2])}
  else{
    const g=STG.find(x=>f<x[0]);tt=g[1];ds=g[2];
    tl=c.cls==="no"?T+" · 💧 ارفع الرطوبة إلى <bdi>"+th[2]+"</bdi> ولا تقلّب":T+" · "+H(th[1]);
  }
  return `<div class="tt">${tt}</div><p>${ds}</p><p class="tl">${tl}</p><small>القيم تقريبية، واتّبع إرشادات جهازك إن اختلفت.</small>`;
}

/* ---------- الحساب والعرض ---------- */
function calc(b){
  const now=Date.now(),hatch=b.start+b.days*DAY,stop=hatch-b.lock*DAY,iv=b.iv*HR;
  const age=Math.max(0,now-b.start);
  let next=null;
  if(now<stop){const bs=b.tb||b.start,k=Math.max(b.tb?0:1,Math.floor((now-bs)/iv)+1);const n=bs+k*iv;if(n<stop)next=n}
  let st="🔄 مرحلة التقليب",cls="";
  if(now<b.start){st="⏰ لم تبدأ بعد"}
  else if(now>=hatch){st="🐣 حان موعد الفقس";cls="ok"}
  else if(now>=stop){st="⛔ تثبيت: لا تقلّب";cls="no"}
  return{age,hatch,stop,next,st,cls,now,pct:Math.min(100,age/(b.days*DAY)*100)};
}
function cand(b,c){
  const e=b.cand;
  if(e)return `<div class="cand"><div class="t">نتيجة الفحص بالضوء (اليوم 5)</div><div class="split" role="img" aria-label="مخصبة ${pc(e.f,b.eggs)}% وفارغة ${pc(e.c,b.eggs)}%"><i class="f" style="width:${pc(e.f,b.eggs)}%"></i><i class="c" style="width:${pc(e.c,b.eggs)}%"></i></div><div class="n"><span class="f">مخصبة ${e.f} (${pc(e.f,b.eggs)}%)</span><span class="c">فارغة ${e.c} (${pc(e.c,b.eggs)}%)</span></div><button data-a="cand">تعديل النتيجة</button></div>`;
  if(c.age>=5*DAY)return `<div class="cand"><div class="t">حان الفحص بالضوء. سجّل عدد البيض الفارغ.</div><button data-a="cand">تسجيل نتيجة الفحص</button></div>`;
  return `<div class="cand"><div class="t">الفحص بالضوء بعد اليوم 5: ${fd(b.start+5*DAY)}</div></div>`;
}
const OPEN=new Set();
$("#list").addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("more")){const id=+d.dataset.id;d.open?OPEN.add(id):OPEN.delete(id)}},true);
const times=n=>{n=+(+n).toFixed(1);return Number.isInteger(n)?(n===1?"مرة واحدة":n===2?"مرتان":n<=10?n+" مرات":n+" مرة"):n+" مرة"};
function render(){
  const L=$("#list");
  $("#hs").textContent=S.b.length?(S.b.length===1?"دفعة واحدة":S.b.length+" دفعات"):"لا توجد دفعات";
  if(!S.b.length){L.innerHTML=`<div class="empty"><svg viewBox="0 0 100 130" aria-hidden="true"><path d="${EG}" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 6"/></svg><b>لا توجد دفعات بعد</b>اضغط «دفعة جديدة» لتبدأ متابعة أول بيضة.</div>`;return}
  L.innerHTML=S.b.map(b=>{const c=calc(b);return `<article class="batch" data-id="${b.id}" data-cd="${c.age>=5*DAY?1:0}">
  <div class="top">
    <svg class="egg" viewBox="0 0 100 130" aria-hidden="true"><defs><clipPath id="e${b.id}"><path d="${EG}"/></clipPath></defs><path class="eshell" d="${EG}"/><g clip-path="url(#e${b.id})"><rect class="efill" data-k="fill" x="0" y="4" width="100" height="122" style="transform:translateY(124px)"/><ellipse class="emb" data-k="emb" cx="50" cy="90" rx="22" ry="28" style="transform:scale(.1)"/></g><path class="eline" d="${EG}"/></svg>
    <div class="info"><h2>${esc(b.name)}</h2><div class="muted">${b.eggs} بيضة${spName(b)?" · "+esc(spName(b)):""}</div>
    <div class="day"><b data-k="dayn"></b> <span class="of">من ${b.days} يوماً</span></div><span class="stage ${c.cls}" data-k="st"></span></div>
  </div>
  <div class="turn" data-k="turn"><div class="lb">التقليب القادم (${times(24/b.iv)} يومياً)</div><div class="cd" data-k="nx"></div><div class="nd" data-k="nxd"></div><button class="done" data-a="turn">تم التقليب</button></div>
  <div class="tip" data-k="tip"></div>
  <dl class="facts main">
    <div><dt>عمر الفقاسة</dt><dd data-k="age"></dd></div>
    <div><dt>المتبقي للفقس</dt><dd data-k="left"></dd></div>
  </dl>
  ${cand(b,c)}
  <details class="more" data-id="${b.id}"${OPEN.has(b.id)?" open":""}><summary>كل المواعيد</summary>
  <dl class="facts">
    <div><dt>بداية الحضانة</dt><dd>${fd(b.start)}</dd></div>
    <div><dt>الفقس المتوقع</dt><dd>${fd(c.hatch)}</dd></div>
    <div><dt>إيقاف التقليب</dt><dd>${fd(c.stop)}</dd></div>
    <div><dt>التقليب المسجَّل</dt><dd>${b.log&&b.log.length?b.log.length+" "+(b.log.length>2&&b.log.length<11?"مرات":"مرة"):"لا يوجد"}</dd></div>
    <div class="wide"><dt>آخر تقليب</dt><dd>${b.log&&b.log.length?fd(b.log[b.log.length-1]):"لم يُسجَّل بعد"}</dd></div>
  </dl></details>
  <button class="edit" data-a="edit">تعديل الدفعة</button></article>`}).join("");
  void L.offsetHeight;
  tick();
}
function tick(){
  S.b.forEach(b=>{
    const el=$('.batch[data-id="'+b.id+'"]');if(!el)return;
    const c=calc(b),q=k=>el.querySelector('[data-k="'+k+'"]');
    if(el.dataset.cd!=(c.age>=5*DAY?1:0)){render();return}
    q("age").textContent=dur(c.age);
    q("fill").style.transform="translateY("+(122*(1-c.pct/100))+"px)";
    q("emb").style.transform="scale("+(0.12+0.88*c.pct/100)+")";
    const th=tipHtml(b,c);if(el.dataset.th!==th){q("tip").innerHTML=th;el.dataset.th=th}
    q("dayn").textContent="اليوم "+Math.min(b.days,Math.floor(c.age/DAY)+1);
    q("left").textContent=c.now>=c.hatch?"انتهت المدة":dur(c.hatch-c.now);
    q("st").textContent=c.st;
    q("nx").textContent=c.next?dur(c.next-c.now):"—";
    q("nxd").textContent=c.next?"الموعد: "+fd(c.next):(c.now>=c.stop?"انتهى التقليب":"");
    q("turn").classList.toggle("off",!c.next);
  });
}

/* ---------- نموذج الإضافة والتعديل ---------- */
let editId=null,tb0="",st0=0;
const ivHint=()=>{
  const n=num($("#tpd").value);
  let t=n>=1&&n<=24?"التقليب كل "+(+(24/n).toFixed(2))+" ساعة":"";
  const i=+$("#sp").value,days=i==8?num($("#cd").value):SP[i][1],cap=Math.max(60,Math.floor(450/Math.max(1,S.b.length+(editId?0:1))));
  if(n>=1&&days>=1&&n*days>cap)t+=(t?" · ":"")+"عدد التنبيهات كبير، فافتح التطبيق كل بضعة أيام ليجدّدها.";
  $("#ivh").textContent=t};
const spChange=()=>$("#cu").style.display=$("#sp").value==8?"block":"none";
$("#sp").onchange=()=>{spChange();ivHint()};$("#cd").oninput=ivHint;$("#tpd").oninput=ivHint;
function openSheet(b,focus){
  editId=b?b.id:null;
  $("#sh").textContent=b?"تعديل الدفعة":"دفعة جديدة";
  $("#nm").value=b?b.name:"";
  const si=b?(b.sp!=null?b.sp:(SP.findIndex((s,i)=>i<8&&s[1]===b.days&&s[2]===b.lock)+1||9)-1):0;
  $("#sp").value=si<0?8:si;spChange();
  $("#cd").value=b?b.days:21;
  $("#ec").value=b?b.eggs:20;
  $("#tpd").value=b?+(24/b.iv).toFixed(2):3;
  $("#st").value=loc(b?b.start:Date.now());
  st0=b?b.start:0;
  const nx=b?calc(b).next:null;
  tb0=nx?loc(nx):"";
  $("#tb").value=tb0;
  $("#tbw").style.display=b?"block":"none";
  $("#clw").style.display=b?"block":"none";
  $("#cl").value=b&&b.cand?b.cand.c:"";
  $("#dl").style.display=b?"block":"none";
  ivHint();
  $("#sheet").hidden=false;
  if(!b)perm();
  if(focus)setTimeout(()=>$(focus).focus(),50);
}
const closeSheet=()=>{$("#sheet").hidden=true};
$("#cn").onclick=closeSheet;
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.hidden=true}));
$("#fab").onclick=()=>openSheet(null);
$("#tn").onclick=async()=>{await perm();beep();notify("🐣 المفقسة","الإشعارات والصوت يعملان ✅")};

$("#sv").onclick=()=>{
  const i=+$("#sp").value,sp=SP[i];
  const start=new Date($("#st").value).getTime();
  if(!start)return alert("اختر وقت بداية الحضانة");
  const eggs=Math.round(num($("#ec").value));
  if(!(eggs>=1))return alert("اكتب عدد البيض");
  const tpd=num($("#tpd").value);
  if(!(tpd>=1&&tpd<=24))return alert("مرات التقليب يومياً من 1 إلى 24");
  const days=i==8?Math.round(num($("#cd").value)):sp[1];
  if(!(days>=1))return alert("اكتب مدة الحضانة بالأيام");
  let cd=null;const cv=$("#cl").value.trim();
  if(cv!==""){const c=Math.round(num(cv));if(!(c>=0&&c<=eggs))return alert("عدد البيض الفارغ يجب أن يكون بين 0 و"+eggs);cd={c,f:eggs-c}}
  const name=$("#nm").value.trim()||sp[0],iv=24/tpd;
  if(!editId){
    const b={id:S.n++,name,sp:i,eggs,start,days,lock:sp[2],iv,log:[]};
    if(cd)b.cand=cd;
    S.b.push(b);save();plan(b);
  }else{
    const b=S.b.find(x=>x.id==editId);if(!b)return closeSheet();
    Object.assign(b,{name,sp:i,eggs,days,lock:sp[2],iv});
    if(start!==b.start){b.start=start;if($("#tb").value===tb0)delete b.tb}
    if($("#tb").value&&$("#tb").value!==tb0){const t=new Date($("#tb").value).getTime();if(t)b.tb=t}
    if(cd)b.cand=cd;else delete b.cand;
    save();plan(b);
  }
  closeSheet();render();
};
$("#dl").onclick=()=>{
  const b=S.b.find(x=>x.id==editId);
  if(b&&confirm("حذف الدفعة «"+b.name+"»؟ لا يمكن التراجع.")){b.gone=1;plan(b);S.b=S.b.filter(x=>x.id!=editId);save();closeSheet();render()}
};

$("#list").onclick=e=>{
  const a=e.target.dataset.a;if(!a)return;
  const id=+e.target.closest(".batch").dataset.id,b=S.b.find(x=>x.id==id);if(!b)return;
  if(a==="turn"){(b.log=b.log||[]).push(Date.now());save();render()}
  if(a==="edit")openSheet(b);
  if(a==="cand")openSheet(b,"#cl");
};

/* ---------- نغمة التنبيه ---------- */
const rmsg=t=>$("#rmsg").textContent=t;
const rshow=()=>{$("#rcur").textContent="النغمة الحالية: "+(RING?(RING.title||"نغمة من الهاتف"):"الافتراضية للتطبيق")};
$("#rgb").onclick=()=>{rshow();rmsg(RP?"":"اختيار النغمة يعمل داخل تطبيق أندرويد فقط.");$("#rg").hidden=false};
$("#rclose").onclick=()=>{$("#rg").hidden=true};
$("#rpick").onclick=async()=>{
  if(!RP)return rmsg("اختيار النغمة يعمل داخل تطبيق أندرويد فقط.");
  try{
    await perm();
    const r=await RP.pick({title:"اختر نغمة التنبيه",name:"تنبيهات المفقسة",current:RING?RING.uri:"",previous:RING?RING.ch:""});
    if(!r||r.cancelled)return;
    RING={ch:r.channelId,title:r.title,uri:r.uri};
    try{localStorage.setItem("incRing",JSON.stringify(RING))}catch(e){}
    rshow();rmsg("تم الحفظ. جارٍ تحديث التنبيهات...");
    for(const b of S.b)await plan(b);
    rmsg("تم تغيير النغمة ✓");notify("🐣 المفقسة","هذه هي النغمة الجديدة");
  }catch(e){rmsg("تعذّر فتح قائمة النغمات.")}
};
$("#rtest").onclick=async()=>{await perm();beep();notify("🐣 المفقسة","تجربة النغمة")};
$("#rreset").onclick=async()=>{
  if(!RING)return rmsg("تستخدم النغمة الافتراضية بالفعل.");
  const old=RING.ch;RING=null;try{localStorage.removeItem("incRing")}catch(e){}
  try{if(RP)await RP.remove({channelId:old})}catch(e){}
  rshow();for(const b of S.b)await plan(b);rmsg("عادت النغمة الافتراضية ✓");
};

/* ---------- النسخة الاحتياطية ---------- */
const bmsg=t=>$("#bmsg").textContent=t;
$("#bkb").onclick=()=>{$("#bt2").value=JSON.stringify({v:1,n:S.n,b:S.b});bmsg("");$("#bk").hidden=false};
$("#bclose").onclick=()=>{$("#bk").hidden=true};
$("#bcopy").onclick=async()=>{
  const ta=$("#bt2");ta.value=JSON.stringify({v:1,n:S.n,b:S.b});
  try{await navigator.clipboard.writeText(ta.value);bmsg("تم النسخ ✓")}
  catch(e){ta.focus();ta.select();try{document.execCommand("copy");bmsg("تم النسخ ✓")}catch(_){bmsg("حدّد النص وانسخه يدوياً")}}
};
$("#bimp").onclick=async()=>{
  let d;try{d=JSON.parse($("#bt2").value)}catch(e){return bmsg("النص غير صالح. تأكد من لصق النسخة كاملة.")}
  const ok=x=>x&&[x.id,x.eggs,x.start,x.days,x.lock,x.iv].every(v=>typeof v==="number"&&isFinite(v))&&typeof x.name==="string"&&x.iv>0;
  if(!d||!Array.isArray(d.b)||!d.b.every(ok))return bmsg("النص غير صالح. تأكد من لصق النسخة كاملة.");
  if(!confirm("سيستبدل الاستيراد كل الدفعات الحالية بـ "+d.b.length+" دفعة. متابعة؟"))return;
  for(const b of S.b){b.gone=1;await plan(b)}
  S.b=d.b;S.n=Math.max(+d.n||1,...d.b.map(x=>x.id+1),1);save();
  for(const b of S.b)await plan(b);
  render();$("#bk").hidden=true;
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)S.b.forEach(plan)});

S.b.forEach(plan);render();setInterval(tick,1000);
</script>
</body>
</html>
